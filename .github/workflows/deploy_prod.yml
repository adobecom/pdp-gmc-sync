name: AIO App CI

on:
  release:
    types: [released]
jobs:
  deploy:
    name: Deploy to Prod
    runs-on: ${{ matrix.os }}
    environment: production
    strategy:
      max-parallel: 1
      matrix:
        node-version: ['20']
        os: [ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: npm install
        run: npm i
      - name: Setup CLI
        uses: adobe/aio-cli-setup-action@1.3.0
        with:
          os: ${{ matrix.os }}
          version: 11.x.x
      - name: Auth
        uses: adobe/aio-apps-action@4.1.0
        with:
          os: ${{ matrix.os }}
          command: oauth_sts
          CLIENTID: ${{ secrets.CLIENTID }}
          CLIENTSECRET: ${{ secrets.CLIENTSECRET }}
          TECHNICALACCOUNTID: ${{ secrets.TECHNICALACCID }}
          TECHNICALACCOUNTEMAIL: ${{ secrets.TECHNICALACCEMAIL }}
          IMSORGID: ${{ secrets.IMSORGID }}
          SCOPES: ${{ secrets.SCOPES }}
      - name: Build
        env:
          AIO_RUNTIME_NAMESPACE: ${{ secrets.AIO_RUNTIME_NAMESPACE }}
        uses: adobe/aio-apps-action@4.1.0
        with:
          os: ${{ matrix.os }}
          command: build
      - name: Deploy
        env:
          AIO_RUNTIME_NAMESPACE: ${{ secrets.AIO_RUNTIME_NAMESPACE }}
          AIO_RUNTIME_AUTH: ${{ secrets.AIO_RUNTIME_AUTH }}
          AIO_PROJECT_ID: ${{ secrets.AIO_PROJECT_ID }}
          AIO_PROJECT_NAME: ${{ secrets.AIO_PROJECT_NAME }}
          AIO_PROJECT_ORG_ID: ${{ secrets.AIO_PROJECT_ORG_ID }}
          AIO_PROJECT_WORKSPACE_ID: ${{ secrets.AIO_PROJECT_WORKSPACE_ID }}
          AIO_PROJECT_WORKSPACE_NAME: ${{ secrets.AIO_PROJECT_WORKSPACE_NAME }}
          AIO_PROJECT_WORKSPACE_DETAILS_SERVICES: ${{ secrets.AIO_PROJECT_WORKSPACE_DETAILS_SERVICES }}
          # Runtime action inputs — app.config.yaml resolves these $VARS into each action's
          # encrypted default params at deploy time. Without them the actions deploy with EMPTY
          # GMC config and can't reach Merchant Center. GMC_ENV/LOG_LEVEL are non-secret literals.
          GMC_ENV: prod
          LOG_LEVEL: info
          GMC_MERCHANT_ACCOUNT_ID: ${{ secrets.GMC_MERCHANT_ACCOUNT_ID }}
          GMC_DATASOURCE_ID: ${{ secrets.GMC_DATASOURCE_ID }}
          GMC_GCP_PROJECT_ID: ${{ secrets.GMC_GCP_PROJECT_ID }}
          GMC_SERVICE_ACCOUNT_JSON: ${{ secrets.GMC_SERVICE_ACCOUNT_JSON }}
          GMC_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GMC_SERVICE_ACCOUNT_EMAIL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          LANA_CLIENT_ID: ${{ secrets.LANA_CLIENT_ID }}
          # price-sync (daily Zazzle -> GMC price job): off | dry-run | live;
          # report | enabled for deleting offers Zazzle no longer returns;
          # ignore | send for writing Zazzle's per-offer shipping rates.
          PRICE_SYNC_MODE: 'off'
          PRICE_SYNC_DELETES: 'report'
          PRICE_SYNC_SHIPPING: 'ignore'
        uses: adobe/aio-apps-action@4.1.0
        with:
          os: ${{ matrix.os }}
          command: deploy
